# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gen-tables-check:
    name: Conversion table reproducibility check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The tables come from the @vscode/iconv-lite-umd devDependency.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      - name: Verify against the golden hash
        run: python3 tools/gen-tables/gen_tables.py --check

  build-and-test:
    name: Native build + test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # xfonts-encodings installs X11's ".enc" tables, which upstream luit
      # would prefer over the fork's built-in ones (see luit.c's
      # lookup_order); the tests then check that ours still win.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf xfonts-encodings
      # The editor-parity test compares with iconv-lite.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      # Fails on a compiler warning upstream's code doesn't already have
      - name: Build transcoder
        run: bash transcoder/scripts/build.sh --warnings
      - name: Run table-driven tests
        run: python3 tests/test_encodings.py
      - name: Compare every encoding with VS Code's editor
        timeout-minutes: 10
        run: python3 tests/test_editor_parity.py
      - name: shellcheck
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck transcoder/scripts/*.sh tools/release/*.sh .devcontainer/setup.sh

  # macOS takes different paths in places (process names fixed at exec, so
  # no tab-title tracking; no /proc), and nothing else exercises it.
  build-and-test-macos:
    name: Native build + test suite (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: brew install autoconf
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      # With clang, which gets the same warnings as gcc does on Linux
      - name: Build transcoder
        run: bash transcoder/scripts/build.sh --warnings
      - name: Run table-driven tests
        run: python3 tests/test_encodings.py
      - name: Compare every encoding with VS Code's editor
        timeout-minutes: 10
        run: python3 tests/test_editor_parity.py

  # luit converts whatever bytes programs print and whatever is typed, in
  # fixed-size buffers. The test suites run it through every encoding's
  # every byte sequence, so under AddressSanitizer, UBSan and LeakSanitizer
  # they also check it for out-of-bounds access, undefined behavior and
  # leaks. Linux only: LeakSanitizer doesn't run on macOS.
  sanitizers:
    name: Transcoder under ASan + UBSan + LSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf
      # Reports go to files: luit's stderr is the terminal, where the tests
      # wouldn't see them. Set here, as the runner context (its temporary
      # directory) isn't available to a job's env.
      - name: Send sanitizer reports to files
        run: |
          mkdir -p "$RUNNER_TEMP/sanitizers"
          echo "ASAN_OPTIONS=detect_leaks=1:log_path=$RUNNER_TEMP/sanitizers/asan" >> "$GITHUB_ENV"
          echo "UBSAN_OPTIONS=print_stacktrace=1:log_path=$RUNNER_TEMP/sanitizers/ubsan" >> "$GITHUB_ENV"
      # ASan's shadow memory can't be placed with the kernel's highest
      # mmap randomization
      - name: Lower ASLR entropy for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      - name: Build transcoder with sanitizers
        run: bash transcoder/scripts/build.sh --sanitize
      - name: Run table-driven tests
        run: python3 tests/test_encodings.py
      - name: Compare every encoding with VS Code's editor
        timeout-minutes: 15
        run: python3 tests/test_editor_parity.py
      # A report doesn't always fail a test (it can come from a process the
      # test doesn't wait for), so any report fails the job
      - name: Fail on any sanitizer report
        if: always()
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/sanitizers/*)
          if [ "${#reports[@]}" -gt 0 ]; then
            cat "${reports[@]}"
            exit 1
          fi

  spellcheck:
    name: Spell check (Japanese docs excluded)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npx --yes cspell@8 lint --no-progress "**/*.{ts,js,c,h,md}" --exclude "docs/**/*.md" --exclude "**/*.ja.md"

  lint-and-unit-test:
    name: TypeScript lint + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit

  # Verifies the lower bound of engines.vscode against real versions (see
  # AGENTS.md#lower-bound-of-enginesvscode). Also covers the fact that
  # onDidWriteTerminalData (a proposed API), used by some tests, requires
  # --enable-proposed-api.
  integration-test:
    name: VS Code integration tests (${{ matrix.vscode-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.73.0", "1.85.0", "1.94.0", "stable"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf xvfb fish zsh
      - run: npm ci --ignore-scripts
      - name: Build transcoder (the extension requires transcoder/bin/luit at startup)
        run: |
          bash transcoder/scripts/build.sh
          mkdir -p transcoder/bin
          cp transcoder/src/luit transcoder/bin/luit
      - name: Run integration tests
        run: xvfb-run -a npm run test:integration -- --vscode-version ${{ matrix.vscode-version }}

  integration-test-macos:
    name: VS Code integration tests (macOS, stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - name: Install build dependencies
        run: brew install autoconf fish
      - run: npm ci --ignore-scripts
      - name: Build transcoder (the extension requires transcoder/bin/luit at startup)
        run: |
          bash transcoder/scripts/build.sh
          mkdir -p transcoder/bin
          cp transcoder/src/luit transcoder/bin/luit
      - name: Run integration tests
        run: npm run test:integration -- --vscode-version stable
