# This workflow is managed by gh actions-lock.

name: Build transcoder (musl static)

on:
  push:
    branches: [main]
    paths:
      - "transcoder/**"
      - "tools/gen-tables/**"
  pull_request:
    paths:
      - "transcoder/**"
      - "tools/gen-tables/**"
  workflow_call:
    outputs:
      artifact-name:
        description: "Artifact name prefix for the built binaries"
        value: transcoder

permissions:
  contents: read

jobs:
  linux-musl:
    name: Linux musl static build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # format: what `file` must report for the binary
          - arch: x64
            runner: ubuntu-24.04
            platform: linux/amd64
            format: "ELF 64-bit LSB .*x86-64"
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            format: "ELF 64-bit LSB .*ARM aarch64"
          - arch: armhf
            runner: ubuntu-24.04-arm
            platform: linux/arm/v7
            format: "ELF 32-bit LSB .*ARM, EABI5"
    steps:
      - uses: actions/checkout@v4.4.0
      # Built natively in Alpine, whose compiler targets musl, on a runner of
      # the same architecture, so every binary also runs the test suite.
      - name: Build and test in Alpine
        env:
          # Alpine 3.24.2 (multi-arch index), pinned by digest
          IMAGE: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
        run: |
          docker run --rm --platform "$PLATFORM" -e ARCH -e FORMAT \
            -v "$PWD":/src -w /src "$IMAGE" sh -euc '
              apk add --no-cache build-base autoconf bash file python3 nodejs npm
              npm ci --ignore-scripts
              bash transcoder/scripts/build.sh --musl --arch "$ARCH"
              file transcoder/src/luit | grep -E "$FORMAT"
              file transcoder/src/luit | grep -E "static(ally|-pie) linked"
              python3 tests/test_encodings.py
              python3 tests/test_editor_parity.py
            '
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: transcoder-linux-${{ matrix.arch }}
          path: transcoder/src/luit
          retention-days: 7

  macos:
    name: macOS build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # macos-13 has been retired and macos-14 is deprecated; see
          # https://github.com/actions/runner-images#available-images
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Dependencies (Homebrew)
        run: brew install autoconf automake
      # The editor-parity test compares with iconv-lite.
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      - name: Build (dynamically linked, since macOS can't statically link libSystem)
        run: |
          bash transcoder/scripts/build.sh
          strip transcoder/src/luit
      - name: Verify
        run: |
          python3 tests/test_encodings.py
          python3 tests/test_editor_parity.py
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: transcoder-darwin-${{ matrix.arch }}
          path: transcoder/src/luit
          retention-days: 7
