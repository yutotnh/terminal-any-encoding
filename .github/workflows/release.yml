# This workflow is managed by gh actions-lock.

name: Release

# Triggered by a tag (v*): verifies, builds VSIXes for all 7 platform targets,
# publishes them to both the Marketplace and Open VSX, and then creates the
# GitHub release (notes from CHANGELOG.md, the VSIXes attached).
#
# Nothing is published until every target has been packaged, so a failure in
# one target can't leave a partial release behind. The GitHub release comes
# last, so it only exists once both registries have the version; releases are
# immutable, so it couldn't be fixed up afterwards anyway.
#
# Required repository settings (details in CONTRIBUTING.md#releasing):
#   - Marketplace: no PAT is stored. `vsce publish --azure-credential` signs in
#     as a user-assigned managed identity through GitHub OIDC (azure/login).
#     The identity has a federated credential for this repository's `release`
#     environment and is a member of the Marketplace publisher; its client ID
#     and tenant ID are the AZURE_CLIENT_ID / AZURE_TENANT_ID secrets.
#   - Open VSX: OVSX_PAT secret (a token signed under the Eclipse Publisher
#     Agreement).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - name: Tag must match package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      - name: CHANGELOG.md must have notes for this version
        run: tools/release/changelog-section.sh "${GITHUB_REF_NAME#v}"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - name: Conversion table reproducibility check
        run: python3 tools/gen-tables/gen_tables.py --check

  # Builds every platform's binary and runs tests/test_encodings.py against
  # the ones the runner can execute.
  build-transcoder:
    uses: ./.github/workflows/build-transcoder.yml

  package:
    name: Package VSIX (${{ matrix.target }})
    needs: [verify, build-transcoder]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # for attest-build-provenance
      attestations: write
    strategy:
      matrix:
        include:
          - target: linux-x64
            artifact: transcoder-linux-x64
          - target: linux-arm64
            artifact: transcoder-linux-arm64
          - target: linux-armhf
            artifact: transcoder-linux-armhf
          - target: alpine-x64
            artifact: transcoder-linux-x64 # musl static, so just reuse the Linux build
          - target: alpine-arm64
            artifact: transcoder-linux-arm64
          - target: darwin-x64
            artifact: transcoder-darwin-x64
          - target: darwin-arm64
            artifact: transcoder-darwin-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: transcoder/bin
      - name: Make the binary executable
        run: chmod +x transcoder/bin/luit
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: transcoder/bin/luit
      - run: npm ci --ignore-scripts
      # enabledApiProposals is only there so the integration tests can use
      # onDidWriteTerminalData (src/test/runTest.ts); product code doesn't use
      # it, and the Marketplace rejects extensions that declare it.
      - name: Drop the test-only proposed API declaration
        run: npm pkg delete enabledApiProposals
      # vsce doesn't create the -o file's directory.
      - name: Create VSIX package
        run: |
          mkdir -p dist
          npx vsce package --target ${{ matrix.target }} -o "dist/${{ matrix.target }}.vsix"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix

  publish:
    name: Publish to the Marketplace and Open VSX
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # for the GitHub release
      id-token: write # for azure/login (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ./.nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Sign in to Microsoft Entra ID (OIDC)
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # --skip-duplicate skips a target the registry already has, so after a
      # partial failure (e.g. Open VSX down after the Marketplace succeeded)
      # rerunning this job finishes the release instead of failing on it.
      - name: Publish to the Marketplace
        run: npx vsce publish --azure-credential --skip-duplicate --packagePath dist/*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for vsix in dist/*.vsix; do
            npx ovsx publish "$vsix" --skip-duplicate
          done
      # gh uploads the assets to a draft and publishes it only after that, so
      # this works with immutable releases.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tools/release/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          for vsix in dist/*.vsix; do
            mv "$vsix" "dist/terminal-any-encoding-${version}-$(basename "$vsix")"
          done
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
