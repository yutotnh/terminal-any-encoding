# transcoder/ (the luit fork, C) is out of scope here; C dependencies can't be
# covered by this. Tracking luit's upstream is handled separately by
# .github/workflows/upstream-watch.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Matches engines.vscode's lower bound on purpose: newer types would
      # let code use APIs that VS Code 1.73 doesn't have (and vsce refuses
      # types newer than engines.vscode). See AGENTS.md.
      - dependency-name: "@types/vscode"
      # Its major version follows .nvmrc's Node.js (see AGENTS.md); minor
      # and patch updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 has no compiler API in the "typescript" package
      # anymore, which typescript-eslint needs (it supports up to 6.0).
      # Drop this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Dependabot doesn't update .github/workflows/actions.lock, so its PRs
  # fail at startup until the lock is regenerated (see AGENTS.md). One
  # grouped PR keeps that to a single fix-up.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
